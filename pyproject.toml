[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app2nix"]

[tool.hatch.build]
include = ["src/app2nix/gui/templates/**"]

[project]
name = "app2nix"
version = "3.0.0"
description = "Convert any Linux package (.deb, .rpm, AppImage, Flatpak, Snap) to NixOS native applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Azmi", email = "azmi.hitech@gmail.com"},
]
keywords = ["nixos", "nix", "packaging", "conversion", "deb", "rpm", "appimage", "flatpak"]
homepage = "https://github.com/HiTechTN/app2nix"
repository = "https://github.com/HiTechTN/app2nix"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "starlette>=0.36",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "aiosqlite>=0.20",
    "itsdangerous>=2.0",
]

[project.scripts]
app2nix     = "app2nix.cli:app"
app2nix-gui = "app2nix.gui:run_gui"

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.2.0",
    "httpx>=0.27",
    "ruff>=0.0.280",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["--cov=src/app2nix", "--cov-report=term-missing", "--cov-fail-under=95"]

[tool.coverage.run]
source = ["src/app2nix"]
omit = ["*/gui/main_window.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src"]
