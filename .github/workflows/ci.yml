name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev --extra gui

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v --cov=src/app2nix --cov-report=xml --cov-report=term --ignore=tests/gui
        env:
          APP2NIX_SECRET_KEY: test-secret-key-for-ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  nix-validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-24.05

      - name: Install app2nix
        run: pip install uv && uv sync
        env:
          APP2NIX_SECRET_KEY: test-ci-key

      - name: Generate and validate Nix expression
        run: |
          mkdir -p /tmp/test_deb/DEBIAN
          echo -e "Package: test-app\nVersion: 1.0\nArchitecture: amd64\nDescription: test" \
            > /tmp/test_deb/DEBIAN/control
          dpkg-deb --build /tmp/test_deb /tmp/test-app_1.0_amd64.deb
          mkdir -p /tmp/nix_output
          uv run app2nix convert /tmp/test-app_1.0_amd64.deb --output-dir /tmp/nix_output
          nix-instantiate --parse /tmp/nix_output/default.nix
          echo "✅ Nix expression is syntactically valid"
        env:
          APP2NIX_SECRET_KEY: test-ci-key

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: mypy src/app2nix --ignore-missing-imports

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: img
        run: |
          echo "name=ghcr.io/hitechtn/app2nix" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.img.outputs.name }}:latest
          cache-from: type=registry,ref=ghcr.io/hitechtn/app2nix:cache
          cache-to: type=registry,ref=ghcr.io/hitechtn/app2nix:cache,mode=max
