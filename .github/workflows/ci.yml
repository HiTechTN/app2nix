name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint (Ruff + Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: mypy src/app2nix --ignore-missing-imports

  rust-check:
    name: Rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, 1.85.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: ${{ matrix.rust == 'stable' && 'clippy, rustfmt' || '' }}
          cache: "true"
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo fmt --check
        if: matrix.rust == 'stable'
      - run: cargo clippy --workspace
        if: matrix.rust == 'stable'
      - run: cargo doc --no-deps --workspace
        if: matrix.rust == 'stable'
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg patchelf file \
            xvfb libnss3 \
            libgl1 libglib2.0-0 libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-cursor0

      - name: Install dependencies
        run: pip install -e ".[dev,gui]"

      - name: Run tests
        run: python -m pytest tests/ -v --cov-report=term-missing --cov-fail-under=95
        env:
          APP2NIX_SECRET_KEY: test-secret-key-for-ci
          QT_QPA_PLATFORM: offscreen

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.11'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  nix-validate:
    name: Nix Validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-24.05

      - name: Install app2nix
        run: pip install uv && uv sync
        env:
          APP2NIX_SECRET_KEY: test-ci-key

      - name: Generate and validate Nix expression
        run: |
          mkdir -p /tmp/test_deb/DEBIAN
          echo -e "Package: test-app\nVersion: 1.0\nArchitecture: amd64\nDescription: test" \
            > /tmp/test_deb/DEBIAN/control
          dpkg-deb --build /tmp/test_deb /tmp/test-app_1.0_amd64.deb
          mkdir -p /tmp/nix_output
          uv run app2nix convert /tmp/test-app_1.0_amd64.deb --output-dir /tmp/nix_output
          nix-instantiate --parse /tmp/nix_output/default.nix
          echo "Nix expression is syntactically valid"
        env:
          APP2NIX_SECRET_KEY: test-ci-key

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, rust-check]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
