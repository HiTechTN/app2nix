name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (Ruff + Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: mypy src/app2nix --ignore-missing-imports

  rust-check:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache: "true"
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo fmt --check
      - run: cargo clippy --workspace

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg patchelf file

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --cov-report=term-missing
        env:
          APP2NIX_SECRET_KEY: test-secret-key-for-ci

  nix-validate:
    name: Nix Validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-24.05

      - name: Install dependencies
        run: pip install -e .
        env:
          APP2NIX_SECRET_KEY: test-ci-key

      - name: Generate and validate Nix expression
        run: |
          mkdir -p /tmp/test_deb/DEBIAN
          echo -e "Package: test-app\nVersion: 1.0\nArchitecture: amd64\nDescription: test" \
            > /tmp/test_deb/DEBIAN/control
          dpkg-deb --build /tmp/test_deb /tmp/test-app_1.0_amd64.deb
          mkdir -p /tmp/nix_output
          python -m app2nix convert /tmp/test-app_1.0_amd64.deb --output-dir /tmp/nix_output --no-validate
          cat /tmp/nix_output/default.nix
          echo "Nix expression generated successfully"
        env:
          APP2NIX_SECRET_KEY: test-ci-key

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, rust-check]
    if: github.ref == 'refs/heads/master' && github.repository == 'HiTechTN/app2nix'
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
